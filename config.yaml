dataset:
  ff_path: "/workspace/TEP_FaultFree_Training.RData"
  ft_path: "/workspace/TEP_Faulty_Training.RData"

data_windowing:
  window_size: 100
  stride: 5
  normal_train_start: 0
  normal_train_end: 248000
  normal_test_start: 248000
  normal_test_end: 250000
  post_fault_start: 160         
  train_runs_start: 1
  train_runs_end: 200
  test_runs_start: 200
  test_runs_end: 220

training:
  epochs: 100
  batch:
    train: 128
    val: 256
    test: 256
  num_workers: 2
  seed: 42
  diffusion:
    enabled: true
    start_epoch: 8
    synth_ratio: 0.2    
    steps_infer: 70
    epochs: 5      
    width: 128
    depth: 2
    margin_gate_delta: 0.1
    selected_faults: [3,9,15]
    export_per_class: 1000
    export_steps_infer: 150

model:
  s: 12.0
  m: 0.15
  margin_type: "arc"
  per_class_margin_overrides:
    "0": 0.15
    "15": 0.25
  center_momentum: 0.95
  center_sep_K: 3
  center_sep_margin: 0.1
  center_pull_weights:
    "0": 1.5
    "15": 2.5
